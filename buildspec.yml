version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 091846656105.dkr.ecr.ap-south-1.amazonaws.com
  build:
    commands:
      - echo Building the Docker image...
      - docker build -t my-ecr .
      - docker tag my-ecr:latest 091846656105.dkr.ecr.ap-south-1.amazonaws.com/my-ecr:latest
  post_build:
    commands:
      - echo Pushing the Docker image to ECR...
      - docker push 091846656105.dkr.ecr.ap-south-1.amazonaws.com/my-ecr:latest
      - echo Writing image definitions file...
      - printf '[{"name":"my-ecr","imageUri":"091846656105.dkr.ecr.ap-south-1.amazonaws.com/my-ecr:latest"}]' > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
